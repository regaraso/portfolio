<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Regina Tarasova</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preload" as="font" href="assets/fonts/GeistMono-latin.woff2" crossorigin>
  <link rel="preload" as="font" href="assets/fonts/GeistMono-cyrillic.woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Geist Mono';
      src: url('assets/fonts/GeistMono-latin.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Geist Mono';
      src: url('assets/fonts/GeistMono-cyrillic.woff2') format('woff2');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
      unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Geist Mono', monospace;
      background: #FAFBFE;
      color: #181818;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }

    .header {
      position: fixed;
      top: 32px;
      left: 80px;
      right: 80px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 100;
    }
    .header__logo { height: 16px; display: block; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
    }

    .num {
      font-size: clamp(120px, 20vw, 260px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      color: #181818;
    }
    .num span { color: #BADD13; }

    .msg {
      margin-top: 24px;
      font-size: clamp(14px, 1.5vw, 18px);
      line-height: 1.5;
      text-transform: uppercase;
      color: #181818;
      opacity: 0.5;
    }

    .back {
      margin-top: 48px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 28px;
      border: 1px solid #181818;
      font-family: inherit;
      font-size: 14px;
      text-transform: uppercase;
      background: #FAFBFE;
      color: #181818;
      cursor: pointer;
      transition: background 0.2s;
    }
    .back:hover { background: #BADD13; }

    @media (max-width: 768px) {
      .header { top: 20px; left: 20px; right: 20px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <a href="/" aria-label="На главную">
      <img src="assets/img/logo_16.svg" alt="" class="header__logo">
    </a>
  </header>

  <main>
    <p class="num">4<span>0</span>4</p>
    <p class="msg">Страница не найдена</p>
    <a href="/" class="back">На главную</a>
  </main>

</body>
</html>
