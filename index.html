/* loader progress: the font, the page itself, everything it loads (window load) and, on desktop, each hero work (main.js reports them).
   The shown value follows the real one but takes at least ~1.3 s; after 6 s it finishes anyway */
(function () {
  var h = document.documentElement, l = document.querySelector('.loader');
  if (h.classList.contains('seen')) { l.remove(); return; }   // already seen in this visit: the name just stands there
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { h.classList.add('ld-done'); l.remove(); return; }
  var total = 3, done = 0, shown = 0, t0 = performance.now(), fill = l.querySelector('.ld-bar i');
  var hit = function () { done++; };
  window.ldTrack = function (im) { total++; if (im.complete) done++; else { im.addEventListener('load', hit); im.addEventListener('error', hit); } };
  document.fonts.ready.then(hit); document.addEventListener('DOMContentLoaded', hit); addEventListener('load', hit);
  var frame = function (now) {
    var real = now - t0 > 6000 ? 1 : Math.min(1, done / total);
    shown = Math.min(real, shown + Math.max((real - shown) * .12, .004), (now - t0) / 1300);   // never ahead of 1.3 s, whatever the frame rate
    fill.style.transform = 'scaleX(' + shown + ')';
    if (shown >= .999) finish(); else requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  // the green grows out of the bar into the whole screen, then the loader goes and the name rises
  function finish() {
    var r = fill.getBoundingClientRect(), g = l.querySelector('.ld-fill'), from = 'inset(' + r.top + 'px ' + (innerWidth - r.right) + 'px ' + (innerHeight - r.bottom) + 'px ' + r.left + 'px)';
    g.style.clipPath = from; g.style.visibility = 'visible'; l.querySelector('.ld-row').style.opacity = 0;
    var a = g.animate([{ clipPath: from }, { clipPath: 'inset(0px 0px 0px 0px)' }], { duration: 900, delay: 150, easing: 'cubic-bezier(.76,0,.24,1)', fill: 'forwards' });
    a.onfinish = function () { h.classList.add('ld-done'); l.remove(); };
  }
})();
